version: '3.9'

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server-prod
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3001
    restart: unless-stopped

